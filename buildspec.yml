version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.10
    commands:
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install nbconvert jupyter

  build:
    commands:
      - echo "Running notebooks"
      - jupyter nbconvert --to notebook --execute TabNet/*.ipynb --ExecutePreprocessor.timeout=600

artifacts:
  files:
    - TabNet/*.ipynb
